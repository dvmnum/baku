<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Baku</title>
    <meta name="manifest.open_in_tab" content="true" />
    <link rel="stylesheet" href="../../assets/shared.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header class="hd">
        <span class="logo">
          <svg class="mark" viewBox="17 35 93 59" aria-hidden="true">
            <defs>
              <mask id="mark-eye" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
                <rect width="128" height="128" fill="#fff" />
                <circle cx="40" cy="51" r="3.4" fill="#000" />
              </mask>
            </defs>
            <g fill="currentColor" mask="url(#mark-eye)">
              <rect x="44" y="44" width="64" height="38" rx="19" />
              <path
                d="M60 44 Q48 38 38 43 Q30 47 25 56 Q21 64 21 72 Q21 76 25 76 Q28 76 29 72 Q31 66 36 66 L60 70 Z"
                stroke="currentColor"
                stroke-width="3"
                stroke-linejoin="round"
              />
              <circle cx="50" cy="40" r="5" />
              <rect x="47" y="72" width="10" height="20" rx="3" />
              <rect x="62" y="72" width="10" height="20" rx="3" />
              <rect x="82" y="72" width="10" height="20" rx="3" />
              <rect x="96" y="72" width="10" height="20" rx="3" />
            </g>
          </svg>
          <span>Baku</span>
        </span>
      </header>

      <section class="card">
        <div class="ch"><h2 data-i18n="optLimit"></h2><span class="sub" id="limit-sub"></span></div>
        <div class="limit">
          <button class="step" id="limit-minus" type="button" data-i18n-aria="optLess">−</button>
          <div class="val"><b id="limit"></b><span data-i18n="optMinutes"></span></div>
          <button class="step" id="limit-plus" type="button" data-i18n-aria="optMore">+</button>
        </div>
        <div class="presets" id="presets"></div>
      </section>

      <section class="card">
        <div class="ch"><h2 data-i18n="optSites"></h2></div>
        <form class="add" id="add-form">
          <input id="add-input" type="text" data-i18n-placeholder="optAddPlaceholder" autocomplete="off" spellcheck="false" />
          <button class="primary" type="submit" data-i18n="optAdd"></button>
        </form>
        <p class="err hidden" id="add-error" role="alert"></p>
        <div class="lhead" id="list-head">
          <span data-i18n="optColSite"></span><span data-i18n="optColToday"></span><span data-i18n="optColLimit"></span><span></span>
        </div>
        <ul class="list" id="site-list"></ul>
        <p class="empty hidden" id="sites-empty" data-i18n="optSitesEmpty"></p>
      </section>

      <section class="card">
        <div class="ch"><h2 data-i18n="optFade"></h2></div>
        <div class="preview">
          <figure>
            <img src="/img/baku-night.webp" alt="" width="1200" height="675" />
            <figcaption data-i18n="optBefore"></figcaption>
          </figure>
          <span class="arrow" aria-hidden="true">→</span>
          <figure>
            <img src="/img/baku-night.webp" alt="" width="1200" height="675" id="preview-after" />
            <figcaption id="preview-after-cap"></figcaption>
          </figure>
        </div>
        <div class="field"><span class="fl" data-i18n="optStrength"></span><div class="seg" id="strength"></div></div>
        <div class="field"><span class="fl" data-i18n="optSpeed"></span><div class="seg" id="speed"></div></div>
        <div class="field"><span class="fl" data-i18n="optMode"></span><div class="seg" id="mode"></div></div>
      </section>

      <p class="foot" data-i18n="optPrivacy"></p>
    </main>
    <div class="saved" id="saved" role="status" data-i18n="optSaved"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
